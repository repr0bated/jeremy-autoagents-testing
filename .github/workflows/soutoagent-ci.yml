name: SoutoAgent CI

on:
  push:
    branches: [ feature/soutoagent-testing ]
  pull_request:
    branches: [ feature/soutoagent-testing ]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: >-
          cargo clippy --all-targets \
            -p autoagents \
            -p autoagents-core \
            -p autoagents-llm \
            -p autoagents-derive \
            -p autoagents-toolkit \
            -p autoagents-test-utils \
            -p autoagents-cli \
            -- -D warnings

      - name: Cargo test (workspace)
        run: cargo test --workspace --exclude autoagents-burn --exclude autoagents-mistral-rs --exclude wasm_agent

  soutoagent-smoke:
    if: false # temporarily disabled until OpenAI secret is configured
    runs-on: ubuntu-latest
    needs: lint-test
    env:
      CARGO_TERM_COLOR: always
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: SoutoAgent smoke test
        run: |
          cargo run --package soutoagent -- \
            --pk-map examples/soutoagent/compare-list.sample.tsv \
            --pk-details examples/soutoagent/compare-list.sample.tsv \
            --task "CI smoke test for compare list" \
            --model gpt-4o
